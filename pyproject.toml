[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-knowledge"
version = "0.1.0"
description = "TUI quản lý skills, MCP và instructions dùng chung cho nhiều agent CLI (claude, codex, pi, omp, agy)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["textual>=0.86"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
agent-knowledge = "agent_knowledge.cli:entry"
ak = "agent_knowledge.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_knowledge = ["*.tcss"]
